[build]
  command = "npm run build"
  publish = "dist"

# Canonical host — apex preferred
[[redirects]]
  from = "https://www.taylor-marriott.com/*"
  to = "https://taylor-marriott.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://taylor-marriott.com/*"
  to = "https://taylor-marriott.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.taylor-marriott.com/*"
  to = "https://taylor-marriott.com/:splat"
  status = 301
  force = true

# Trailing slash normalisation
[[redirects]]
  from = "/contact/"
  to = "/contact"
  status = 301

[[redirects]]
  from = "/discovery-session/"
  to = "/discovery-session"
  status = 301

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
