[build]
  command = "npm run build"
  publish = "dist"

# Canonical host — apex preferred
[[redirects]]
  from = "https://www.taylor-marriott.com/*"
  to = "https://taylor-marriott.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://taylor-marriott.com/*"
  to = "https://taylor-marriott.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.taylor-marriott.com/*"
  to = "https://taylor-marriott.com/:splat"
  status = 301
  force = true

# SPA fallback
# Do not add trailing-slash 301s for app routes. Netlify applies those
# rules to both /path and /path/, which redirects the page to itself.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/pipeline"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/pipeline/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/api/pipeline"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"

[[headers]]
  for = "/api/pipeline/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"

[[headers]]
  for = "/checkout"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/checkout/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/api/domain-search"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/api/create-session"
  [headers.values]
    Cache-Control = "no-store"
