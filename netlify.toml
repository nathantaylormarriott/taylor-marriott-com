[build]
  command = "npm run build"
  publish = "dist"

# Canonical host — apex preferred
[[redirects]]
  from = "https://www.taylor-marriott.com/*"
  to = "https://taylor-marriott.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://taylor-marriott.com/*"
  to = "https://taylor-marriott.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.taylor-marriott.com/*"
  to = "https://taylor-marriott.com/:splat"
  status = 301
  force = true

# SPA fallback
# Do not add trailing-slash 301s for app routes. Netlify applies those
# rules to both /path and /path/, which redirects the page to itself.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
